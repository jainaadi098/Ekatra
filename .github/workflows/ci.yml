name: PM-AJAY Automated CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Audit & Test Engine Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Syntax & Critical Logic Linting (flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv

      - name: Run Test Suite (pytest)
        run: |
          pytest -v --tb=short tests/

      - name: End-to-End PDF Generation & Encoding Gate Test
        run: |
          python -c "
          import asyncio
          from app.database import init_db, SessionLocal
          from app.main import compile_dossier, ACTIVE_CALLS

          init_db()
          db = SessionLocal()
          test_id = 'test-ci-beneficiary-001'

          ACTIVE_CALLS[test_id] = {
              'full_name': 'आवेदक रमेश',
              'village': 'भोपाल',
              'formal_education': '12वीं पास',
              'current_occupation': 'दुकान व खुदरा व्यवसाय',
              'selected_course': {
                  'title': 'Micro-Enterprise Retailer & Store Manager',
                  'id': 'RET/Q0101',
                  'duration': '300 Hours',
                  'center': 'Gram Panchayat Bhawan'
              },
              'enrollment_confirmed': True
          }

          resp = asyncio.run(compile_dossier(test_id, db))
          assert resp.media_type == 'application/pdf', 'MIME type is not application/pdf'
          assert 'Content-Disposition' in resp.headers, 'Content-Disposition header missing'
          assert 'attachment' in resp.headers['Content-Disposition'], 'Attachment header missing'
          print('[✓] PDF Generator safely encoded Hindi strings and compiled without Latin-1 errors.')
          db.close()
          "