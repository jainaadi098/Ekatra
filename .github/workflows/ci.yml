name: PM-AJAY Automated CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Audit & Test Collective Batch Engine
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Syntax & Lint Audit
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test Database Seeding & Schema Integrity
        run: |
          python -c "
          from app.database import init_db, SessionLocal, TrainingCenter, BeneficiaryProfile
          init_db()
          db = SessionLocal()
          centers = db.query(TrainingCenter).count()
          candidates = db.query(BeneficiaryProfile).count()
          db.close()
          assert centers >= 3, f'Expected >=3 centers, found {centers}'
          assert candidates >= 14, f'Expected >=14 synthetic candidates, found {candidates}'
          print(f'[✓] Database verified: {centers} hubs, {candidates} pooled candidates.')
          "

      - name: Test Multi-Dialect Normalizer & Oral RPL Engine
        run: |
          python -c "
          from app.dialect_engine import DialectEngine
          norm = DialectEngine.normalize('Hau, hum solar seekhan chahat hain', 'bundelkhandi')
          assert 'affirmative' in norm, f'Bundelkhandi normalization failed: {norm}'
          q_id, q_text = DialectEngine.get_oral_question('solar_installer', 'bundelkhandi')
          assert len(q_text) > 10, 'Prompt retrieval failed'
          score, gaps = DialectEngine.evaluate_oral_rubric('solar_installer', q_id, 'Dakshin disha mein lagayenge')
          assert score >= 0.5, f'Rubric evaluation failed: score={score}'
          print(f'[✓] Dialect engine & oral rubric test passed: {score * 100}% score.')
          "

      - name: Test Google OR-Tools Collective Batch Solver
        run: |
          python -c "
          from app.matching_engine import CollectiveBatchSolver
          solver = CollectiveBatchSolver(target_capacity=20, min_viable_threshold=12)
          candidates = [
              {'id': i, 'aspired_trade': 'solar_installer', 'latitude': 23.2599 + (i*0.0005), 'longitude': 77.4126, 'mobility_radius_km': 6.0, 'batch_id': None}
              for i in range(15)
          ]
          centers = [{'id': 1, 'center_name': 'Panchayat Hub', 'center_type': 'PANCHAYAT_BHAWAN', 'block': 'Phanda', 'latitude': 23.2599, 'longitude': 77.4126}]
          batches = solver.solve_cohort_allocations(candidates, centers, 'solar_installer')
          assert len(batches) == 1, 'Solver failed to form batch'
          assert batches[0]['enrolled_count'] == 15, 'Batch enrolled count mismatch'
          print(f'[✓] OR-Tools solver passed: Formed batch with {batches[0][\"enrolled_count\"]} candidates.')
          "