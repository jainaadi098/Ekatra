name: PM-AJAY Automated CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Audit & Test Engine
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Syntax & Import Integrity Audit
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify SQLite DB Schema & Catalog Seeding
        run: |
          python -c "
          from app.database import init_db, get_db
          init_db()
          conn = get_db()
          cur = conn.cursor()
          cur.execute('SELECT COUNT(*) FROM nsqf_courses;')
          c_cnt = cur.fetchone()[0]
          cur.execute('SELECT COUNT(*) FROM training_centers;')
          t_cnt = cur.fetchone()[0]
          conn.close()
          assert c_cnt > 0, 'Catalog seed failed: no courses found'
          assert t_cnt > 0, 'Catalog seed failed: no centers found'
          print(f'[✓] Database bootstrapped: {c_cnt} courses, {t_cnt} centers.')
          "

      - name: Execute Conversational State Machine Integrity Tests
        run: |
          python -c "
          from app.orchestrator import ConversationManager
          slots = {}
          updated = ConversationManager.extract_slots('1', slots)
          assert updated.get('formal_education') == 'No Formal Education', 'Step 1 extraction failed'
          updated = ConversationManager.extract_slots('1', updated)
          assert updated.get('traditional_trade') == 'leather', 'Step 2 extraction failed'
          updated = ConversationManager.extract_slots('खुद का काम करना है', updated)
          assert updated.get('employment_type') == 'SELF_EMPLOYED', 'Step 3 extraction failed'
          updated = ConversationManager.extract_slots('15 किमी', updated)
          assert updated.get('mobility_radius_km') == 15, 'Step 4 extraction failed'
          assert ConversationManager.get_current_step(updated) == 'COMPLETED', 'Machine did not reach terminal state'
          print('[✓] State machine and 1-to-1 deterministic routing passed.')
          "

      - name: Verify NSQF Matching & RPL Bypass Gate
        run: |
          python -c "
          from app.matching_engine import match_nsqf_pathways
          mock = {
              'formal_education': 'No Formal Education',
              'traditional_trade': 'leather',
              'employment_type': 'SELF_EMPLOYED',
              'mobility_radius_km': 25
          }
          recs = match_nsqf_pathways(mock, 23.2599, 77.4126)
          assert len(recs) > 0, 'Matching engine failed'
          assert recs[0]['is_rpl_bridge'] == True, 'RPL bypass gate failure'
          assert '₹50,000' in recs[0]['gia_benefit']['grant_amount'], 'GIA subsidy calculation mismatch'
          print('[✓] NSQF pathways & GIA 50-40-10 financial math verified.')
          "

      - name: Verify Headless ReportLab PDF Synthesis
        run: |
          python -c "
          import uuid
          from app.database import init_db, get_db
          from app.main import download_dossier_pdf
          init_db()
          sid = str(uuid.uuid4())
          conn = get_db()
          cur = conn.cursor()
          cur.execute('''
          INSERT INTO beneficiaries (session_id, formal_education, traditional_trade, employment_type, mobility_radius_km)
          VALUES (?, '10th Pass', 'leather', 'SELF_EMPLOYED', 15);
          ''', (sid,))
          conn.commit()
          conn.close()
          resp = download_dossier_pdf(sid, lang='hi')
          assert resp.status_code == 200, f'Expected 200, got {resp.status_code}'
          assert resp.media_type == 'application/pdf', 'MIME type mismatch'
          print('[✓] ReportLab PDF engine compiles valid binary appraisal stream.')
          "